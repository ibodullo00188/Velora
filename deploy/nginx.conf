# KinoBot — nginx sozlamasi (production)
#
# Bajaradi:
#   • Frontend statik fayllarni xizmat qiladi (SPA fallback bilan)
#   • /api so'rovlarini backend:3000 ga reverse proxy qiladi
#   • Xavfsizlik headerlari (CSP, X-Content-Type-Options va h.k.)
#   • Statik resurslarni keshlash
#
# O'rnatish:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kinobot
#   sudo ln -s /etc/nginx/sites-available/kinobot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Frontend fayllarni serverga ko'chirish:
#   rsync -av frontend/ server:/var/www/kinobot/frontend/
#
# --- HTTPS (certbot/letsencrypt) ------------------------------------------
# Quyidagi blok `listen 80` bilan ishlaydi (sertifikatsiz). SSL o'rnatish
# uchun: 1) `listen 80;` ni o'chirib, quyidagilarni qo'shing:
#
#   listen 443 ssl;
#   ssl_certificate     /etc/letsencrypt/live/kinobot.example.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/kinobot.example.com/privkey.pem;
#   ssl_protocols       TLSv1.2 TLSv1.3;
#
# 2) Va HTTP'ni HTTPS'ga yo'naltirish uchun kichik blok:
#
#   server {
#       listen 80;
#       server_name kinobot.example.com;
#       return 301 https://$host$request_uri;
#   }

server {
    listen 80;
    server_name _;   # ← o'z domeningizga almashtiring: masalan kinobot.example.com

    # --- Xavfsizlik headerlari ------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    # CSP — frontend talab qiladigan tashqi manbalar:
    #   telegram.org (Telegram WebApp SDK skripti), Google Fonts (style/woff2)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; connect-src 'self' https:; frame-src 'self' https://telegram.org" always;

    # --- Frontend (statik) -----------------------------------------------------
    root /var/www/kinobot/frontend;   # ← rsync orqali nusxalangan katalog
    index index.html;

    # SPA: topilmaydigan yo'nalishlar index.html'ga tushadi (12 ekranli ilova)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API reverse proxy -----------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Video oqimi (media-src) buferlanmasin — streymlash yaxshiroq
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # --- Statik resurslarni keshlash (performance) ------------------------------
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Backend 2MB body chegarasi qo'ygan — proxy'da ham xuddi shunday
    client_max_body_size 2m;
}
